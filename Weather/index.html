<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☁️ Weather</title>
    <link rel="shortcut icon" type="img/png" href="img/turn.png">
    <link rel="Stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Great+Vibes&family=Montserrat:wght@400;700&family=Lobster&family=Playfair+Display:wght@400;700&family=Parisienne&family=Anton&family=Allura&family=Sacramento&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');
</style>

</head>

<body id="body">
    <div class="block">
        <div class="search">
            <input class="citytext" type="text" placeholder="enter the city">
            <button><img class="lens" src="image/search.png" alt="search"></button>
        </div>
        <div class="weather">
            <div class="img">
                <img src="" class="weather-icon" alt="">
                <div class="tt">
                    <h1 class="txt">0</h1><span>°C</span>
                </div>
                <div class="city">
                    <h7 class="cityname">- - -</h7>
                </div>
            </div>
            <div class="wind-humidity-container">
                <div class="humidity">
                    <div class="wind-humidity-row">
                        <img src="image/humidity.png" class="weather-icon-humidity" alt="">
                        <h6 class="Humidity-output"></h6>
                    </div>
                    <h5>Humidity</h5>
                </div>
                <div class="Wind">
                    <div class="wind-humidity-row">
                        <img src="image/wind.png" class="weather-icon-wind" alt="">
                        <h6 class="wind-output"></h6>
                    </div>
                    <h5>Wind Speed</h5>
                </div>
            </div>
        </div>
    </div>

    </div>
    <script src="./Script.js"></script>
</body>

</html>
